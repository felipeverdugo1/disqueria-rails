services:
  db:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ejemplo_development
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      target: build
    entrypoint: []
    command: >
      bash -c "
        sed -i 's/\r$//' bin/* &&
        chmod +x bin/* &&
        rm -f tmp/pids/server.pid &&
        mkdir -p app/assets/builds &&
        touch app/assets/builds/tailwind.css &&
        bin/rails server -b 0.0.0.0 -p 3000
      "
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: admin
      SECRET_KEY_BASE: a63a8d130d9f3a89ee769ded26822fc0
    volumes:
      - .:/rails
    ports:
      - "3000:3000"